<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Dynamic Royal Blue to Cyan Gradient -->
    <linearGradient id="bgGrad" x1="40" y1="472" x2="472" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="45%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Wing Fill Gradient -->
    <linearGradient id="wingGrad" x1="256" y1="85" x2="256" y2="373" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="60%" stop-color="#e0f2fe" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#030712" flood-opacity="0.35"/>
    </filter>

    <!-- Subtle Inner Gloss -->
    <linearGradient id="glossGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Tile with Rounded Squircle Shape -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glossGrad)"/>
  <rect x="17" y="17" width="478" height="478" rx="107" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- Centered Ascending Falcon / Bid Arrow Wings -->
  <g filter="url(#dropShadow)">
    <!-- Main Triangular Ascending Wing Geometry -->
    <path
      d="M64 373.3L256 85.3L448 373.3L256 288L64 373.3Z"
      fill="url(#wingGrad)"
      stroke="rgba(255,255,255,0.95)"
      stroke-width="14"
      stroke-linejoin="round"
    />

    <!-- Vertical Spine Vector -->
    <path
      d="M256 85.3V288"
      stroke="#ffffff"
      stroke-width="20"
      stroke-linecap="round"
    />

    <!-- Secondary Chevron Accent Line -->
    <path
      d="M149.3 320L256 192L362.7 320"
      stroke="#ffffff"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />
  </g>
</svg>
